version: 1

collector:
  type: replay
  path: tests/fixtures/process_exec.synthetic.ndjson
  max_record_bytes: 65536

pipeline:
  queue_size: 64

policies:
  - name: all-process-exec
    event_names: [process_exec]
    collectors: [replay]

detectors: [shell-exec]

outputs:
  - name: stdout-json
    type: stdout
    format: json

